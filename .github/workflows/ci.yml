name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-22.04
    env:
      # PR #2 follow-up review (Codex): tells tests/hive/test_config_diff.sh and
      # tests/build/test_package_provenance.sh this IS CI - neither may silently SKIP here (bokiko's own
      # ~/c3work/frozen and real build outdirs exist only on his machine, never on a runner); each instead
      # downloads/generates what it needs to run for real, and a SKIP becomes a hard FAIL if that ever fails.
      # See each script's own header comment for the full rationale.
      BLOX_CI: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: apt dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && break
            echo "apt-get update failed (attempt $i/3), retrying..." >&2
            sleep 5
          done
          sudo apt-get install -y -qq shellcheck jq netcat-openbsd
      - name: syntax
        run: for f in bloxminer/*.sh build/*.sh tools/*.sh tests/*/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -s bash bloxminer/h-config.sh bloxminer/h-run.sh bloxminer/h-stats.sh build/*.sh tools/*.sh tests/*/*.sh
      - name: HiveOS script tests (verus)
        run: tests/hive/test_verus_hive_scripts.sh
      - name: HiveOS script tests (rx)
        run: tests/hive/test_rx_hive_scripts.sh
      - name: HiveOS script tests (dispatcher)
        run: tests/hive/test_dispatcher.sh
      - name: HiveOS script tests (config-diff)
        run: tests/hive/test_config_diff.sh
      - name: HiveOS script tests (rx under load)
        run: tests/hive/test_rx_under_load.sh
      - name: HiveOS script tests (rx stats cache)
        run: tests/hive/test_rx_stats_cache.sh
      - name: HiveOS script tests (verus under load)
        run: tests/hive/test_verus_under_load.sh
      - name: HiveOS script tests (hugepage finalization)
        run: tests/hive/test_hugepage_finalization.sh
      - name: bloxsense tests
        run: tests/bloxsense/run_tests.sh
      - name: build package provenance tests
        run: tests/build/test_package_provenance.sh
      - name: hashing-identity tool controls
        run: tests/tools/test_hashing_identity.sh

  engine:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: release build (same script as the published binary)
        run: build/build.sh -O3 out
      - name: patched source for unit tests and a sanitizer build
        run: tests/engine/prepare_source.sh src
      - name: sensor unit tests (fake sysfs)
        run: |
          clang++-14 -std=c++11 -Wall -g -fsanitize=address,undefined -Isrc tests/engine/test_sys.cpp src/blox_sys.cpp -o test_sys
          setarch -R ./test_sys
      - name: sanitizer build
        run: |
          cd src && ./autogen.sh >/dev/null 2>&1 && CC=clang-14 CXX=clang++-14 CFLAGS="" CXXFLAGS="" ./configure >/dev/null
          make -j"$(nproc)" HIVE_ARCH_FLAGS="-march=x86-64-v3 -maes -mpclmul -fno-strict-aliasing" \
            HIVE_OPT="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" LDFLAGS="-fsanitize=address,undefined" >/dev/null
      # clang 14's ASan crashes at random on kernels with vm.mmap_rnd_bits=32 (even a hello world);
      # setarch -R runs the sanitizer steps without address randomisation
      - name: option and config parsing (release + sanitizer builds)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          tests/engine/cli_test.sh out/bloxminer-O3
          setarch -R tests/engine/cli_test.sh src/ccminer
      - name: malformed pool messages (release + sanitizer builds)
        run: |
          python3 tests/engine/stratum_fuzz.py out/bloxminer-O3
          setarch -R python3 tests/engine/stratum_fuzz.py src/ccminer
      # PR #2 follow-up review (Codex): "Build the RandomX engine in CI" - this outdir feeds the
      # package-provenance-real job below, which runs the REAL tests/build/test_package_provenance.sh tamper-
      # detection suite against ACTUAL build/build.sh + build/build-rx.sh output (never the scripts job's own
      # synthetic-outdir fallback) - the same real-artifact check the RandomX side now gets, see that job.
      - name: upload verus outdir (for package-provenance-real)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verus-out
          path: out

  engine-rx:
    # PR #2 follow-up review (Codex): "Build the RandomX engine in CI" - until now no CI job ever ran
    # build/build-rx.sh at all: the `scripts` job's own provenance test defaults to a SYNTHETIC outdir (fake
    # binary bytes, a genuinely correct provenance file around them - see that test's own header) specifically
    # so it never has to compile anything, so a broken XMRig compile, a donate0/branding patch that no longer
    # applies cleanly, a CMake option regression, or a broken dependency build could all reach master
    # completely unnoticed. Mirrors the Verus `engine` job above: same runner, same "as root, exactly the
    # release recipe" style (build/build-rx.sh itself refuses to run as anything but root/Ubuntu 22.04 - see
    # its own header - so every step below runs under sudo, then hands ownership back to the runner user
    # before anything downstream - upload-artifact included - needs to read the result).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: release build (same script as the published binary, as root)
        run: sudo build/build-rx.sh out
      - name: hand build output back to the runner user
        run: sudo chown -R "$(id -u):$(id -g)" out
      # --dry-run: xmrig parses/validates the config and exits (App.cpp's own isDryRun() short-circuit) -
      # never attempts a real pool connection, so this needs no network beyond the build itself above.
      - name: xmrig runs and shows the BloxMiner branding
        run: |
          VER=$(sed -n 's/^blox_display_version=//p' out/build.provenance)
          [[ -n $VER ]] || { echo "could not read blox_display_version from out/build.provenance"; exit 1; }
          printf '{"pools":[{"url":"stratum+tcp://127.0.0.1:1","user":"W","pass":"x","algo":"rx/0"}],"randomx":{}}' > /tmp/rx-dryrun.json
          out/xmrig --dry-run -c /tmp/rx-dryrun.json | tee /tmp/xmrig-dryrun.out
          grep -q "BLOXMINER" /tmp/xmrig-dryrun.out || { echo "xmrig --dry-run never printed the BLOXMINER branding line"; exit 1; }
          grep -q "$VER" /tmp/xmrig-dryrun.out || { echo "xmrig --dry-run output does not show the pinned display version ($VER)"; exit 1; }
      - name: bloxsense exists and runs
        run: |
          test -x out/bloxsense
          out/bloxsense --json | head -c 1 | grep -q '{'
      - name: build.provenance has the pinned fields
        run: |
          for f in upstream upstream_tag upstream_commit patch_sha256 branding_patch_sha256 blox_display_version \
                   xmrig_sha256 bloxsense_sha256 \
                   dep.libuv.version dep.libuv.sha256 dep.hwloc.version dep.hwloc.sha256 dep.openssl.version dep.openssl.sha256; do
            grep -q "^$f=" out/build.provenance || { echo "out/build.provenance: missing $f="; exit 1; }
          done
      - name: upload rx outdir (for package-provenance-real)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rx-out
          path: out

  package-provenance-real:
    # PR #2 follow-up review (Codex): "Ideally also run the real provenance test against the real outdirs" -
    # both engine jobs above now exist and both already build with the exact release recipe, so this is a
    # small addition that closes a real gap the `scripts` job's own synthetic-outdir fallback cannot: it proves
    # build/package.sh's full tamper-detection suite against BYTES THAT WERE ACTUALLY COMPILED this run (real
    # binary hashes, a real re-clone/re-patch/re-verify of both upstreams for the -src bundle step), never
    # fakeable the way the synthetic fixture's own binary content deliberately is (see that test's own header).
    needs: [engine, engine-rx]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verus-out
          path: verus-out
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rx-out
          path: rx-out
      - name: restore the executable bit (artifact upload/download does not always preserve it)
        run: chmod +x verus-out/bloxminer-O3 rx-out/xmrig rx-out/bloxsense
      - name: package + provenance tamper-detection suite against the REAL build outputs
        run: tests/build/test_package_provenance.sh verus-out rx-out
