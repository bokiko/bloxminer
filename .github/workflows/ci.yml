name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-22.04
    env:
      # PR #2 follow-up review (Codex): tells tests/hive/test_config_diff.sh and
      # tests/build/test_package_provenance.sh this IS CI - neither may silently SKIP here (bokiko's own
      # ~/c3work/frozen and real build outdirs exist only on his machine, never on a runner); each instead
      # downloads/generates what it needs to run for real, and a SKIP becomes a hard FAIL if that ever fails.
      # See each script's own header comment for the full rationale.
      BLOX_CI: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: apt dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && break
            echo "apt-get update failed (attempt $i/3), retrying..." >&2
            sleep 5
          done
          sudo apt-get install -y -qq shellcheck jq netcat-openbsd
      - name: syntax
        run: for f in bloxminer/*.sh build/*.sh tools/*.sh tests/*/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -s bash bloxminer/h-config.sh bloxminer/h-run.sh bloxminer/h-stats.sh build/*.sh tools/*.sh tests/*/*.sh
      - name: HiveOS script tests (verus)
        run: tests/hive/test_verus_hive_scripts.sh
      - name: HiveOS script tests (rx)
        run: tests/hive/test_rx_hive_scripts.sh
      - name: HiveOS script tests (dispatcher)
        run: tests/hive/test_dispatcher.sh
      - name: HiveOS script tests (config-diff)
        run: tests/hive/test_config_diff.sh
      - name: HiveOS script tests (rx under load)
        run: tests/hive/test_rx_under_load.sh
      - name: HiveOS script tests (rx stats cache)
        run: tests/hive/test_rx_stats_cache.sh
      - name: HiveOS script tests (verus under load)
        run: tests/hive/test_verus_under_load.sh
      - name: HiveOS script tests (hugepage finalization)
        run: tests/hive/test_hugepage_finalization.sh
      - name: bloxsense tests
        run: tests/bloxsense/run_tests.sh
      - name: build package provenance tests
        run: tests/build/test_package_provenance.sh
      - name: hashing-identity tool controls
        run: tests/tools/test_hashing_identity.sh

  engine:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: release build (same script as the published binary)
        run: build/build.sh -O3 out
      - name: patched source for unit tests and a sanitizer build
        run: tests/engine/prepare_source.sh src
      - name: sensor unit tests (fake sysfs)
        run: |
          clang++-14 -std=c++11 -Wall -g -fsanitize=address,undefined -Isrc tests/engine/test_sys.cpp src/blox_sys.cpp -o test_sys
          setarch -R ./test_sys
      - name: sanitizer build
        run: |
          cd src && ./autogen.sh >/dev/null 2>&1 && CC=clang-14 CXX=clang++-14 CFLAGS="" CXXFLAGS="" ./configure >/dev/null
          make -j"$(nproc)" HIVE_ARCH_FLAGS="-march=x86-64-v3 -maes -mpclmul -fno-strict-aliasing" \
            HIVE_OPT="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" LDFLAGS="-fsanitize=address,undefined" >/dev/null
      # clang 14's ASan crashes at random on kernels with vm.mmap_rnd_bits=32 (even a hello world);
      # setarch -R runs the sanitizer steps without address randomisation
      - name: option and config parsing (release + sanitizer builds)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          tests/engine/cli_test.sh out/bloxminer-O3
          setarch -R tests/engine/cli_test.sh src/ccminer
      - name: malformed pool messages (release + sanitizer builds)
        run: |
          python3 tests/engine/stratum_fuzz.py out/bloxminer-O3
          setarch -R python3 tests/engine/stratum_fuzz.py src/ccminer
