CUSTOM_NAME=bloxminer
CUSTOM_VERSION=3.0.0
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/bloxminer/config.json
CUSTOM_LOG_BASENAME=/var/log/miner/bloxminer/bloxminer
WEB_PORT=4068   # Verus engine's local UI/API port; RandomX runs on 4069 (WEB_PORT is fixed by Hive's own
                # custom-miner manifest format to one value - the Hive UI's port link is a dead/wrong link
                # while the rx engine is active; the "Miner log" screen view and h-stats-driven farm stats
                # work in both modes regardless, since neither depends on WEB_PORT). See README.
CCD_TEMP_MAP=auto   # AMD per-CCD temps (Verus engine only): auto = validated CPUs only, 1 = force, 0 = package temp
